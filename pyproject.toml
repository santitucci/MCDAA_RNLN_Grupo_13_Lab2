[project]
name = "rnln-2026-lab2"
version = "0.1.0"
description = "RNLN 2026 - Laboratorio 2: Generación de programas DSL con LLMs (Zero-shot, Few-shot y LoRA)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.1,<2.3",
    "matplotlib>=3.8,<3.10",
    "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.4 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers==5.2.0",
    "accelerate>=1.1,<2",
    "peft>=0.18,<1",
    "ipykernel>=6",
]

[tool.uv]
link-mode = "hardlink"
system-certs = true
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]
